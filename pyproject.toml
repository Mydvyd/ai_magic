[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-magic"
version = "0.1.0"
description = "Async multi-provider AI client with credential rotation, fallback, and session history"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "ai_magic contributors"}]
keywords = ["ai", "async", "llm", "openai-compatible", "multi-provider"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "tenacity>=8.2,<10",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["ai_magic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
